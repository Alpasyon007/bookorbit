name: Fork toolchain
description: Install the toolchain declared by the checked-out upstream release.

runs:
  using: composite
  steps:
    - name: Read release toolchain
      id: versions
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { readFileSync, appendFileSync } from 'node:fs';
        const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
        const pnpm = /^pnpm@(\d+\.\d+\.\d+)(?:\+.*)?$/.exec(manifest.packageManager)?.[1];
        const node = /^ARG NODE_IMAGE=node:(\d+\.\d+\.\d+)-/m.exec(readFileSync('Dockerfile', 'utf8'))?.[1];
        if (!pnpm || !node) throw new Error('Review the fork toolchain adapter for this upstream release');
        appendFileSync(process.env.GITHUB_OUTPUT, `pnpm=${pnpm}\nnode=${node}\n`);
        NODE

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}

    - name: Install pinned pnpm
      shell: bash
      env:
        PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
      run: npm install --global "pnpm@$PNPM_VERSION"

    - name: Resolve pnpm cache
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: fork-${{ runner.os }}-node-${{ steps.versions.outputs.node }}-pnpm-${{ steps.versions.outputs.pnpm }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install release dependencies
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: pnpm install --frozen-lockfile
