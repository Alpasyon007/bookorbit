name: Custom Image
run-name: Custom image - ${{ github.ref_name }}

on:
  push:
    tags: ["v*.*.*-custom.*"]

permissions:
  contents: read

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository != 'bookorbit/bookorbit'
    uses: ./.github/workflows/fork-checks.yml

  publish:
    name: Publish verified image
    needs: checks
    if: github.repository != 'bookorbit/bookorbit' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's tested image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.checks.outputs.image-artifact }}
          path: ${{ runner.temp }}/verified-image
      - name: Verify image identity and release tag
        id: meta
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          EXPECTED_ID: ${{ needs.checks.outputs.image-id }}
        run: |
          set -euo pipefail
          node scripts/fork/release-version.mjs "$TAG" > /dev/null
          test -n "$EXPECTED_ID"
          docker load --input "$RUNNER_TEMP/verified-image/fork-image.tar.gz"
          IMAGE="bookorbit-checked:${COMMIT}"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$EXPECTED_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$COMMIT"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")" = "$TAG"
          TARGET="ghcr.io/${REPO,,}:${TAG#v}"
          docker tag "$IMAGE" "$TARGET"
          echo "image=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR after verification
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image
        id: published
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          EXPECTED_ID: ${{ needs.checks.outputs.image-id }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$EXPECTED_ID"
          PUBLISHED_REF=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" | grep -F "${IMAGE%:*}@" | head -n 1)
          test -n "$PUBLISHED_REF"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest-ref=$PUBLISHED_REF" >> "$GITHUB_OUTPUT"
          printf '## Verified custom image\n\nImage: `%s`\n\nDigest: `%s`\n' "$IMAGE" "$PUBLISHED_REF" >> "$GITHUB_STEP_SUMMARY"
